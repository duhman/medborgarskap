name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-a11y:
    # Pinned: ubuntu-latest is 26.04, where Playwright 1.55.1 cannot install Chromium.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and content tests
        run: npm run test

      - name: Route document meta
        run: npm run check:route-meta

      - name: Build
        run: npm run build

      - name: Install pinned Playwright Chromium
        run: npm run test:a11y:install-browser -- --with-deps

      - name: Axe on all routes
        run: npm run test:a11y
