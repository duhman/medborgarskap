name: CI

# Manual only: the GitHub Actions budget is zero, so every check runs locally before merge
# (`npm run check:all`, see AGENTS.md). Start this by hand from the Actions tab if ever needed.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-a11y:
    # Pinned: ubuntu-latest is 26.04, where Playwright 1.55.1 cannot install Chromium.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and content tests
        run: npm run test

      # Downloads Sverige i fokus from uhr.se and checks every question's quote is on its cited page.
      # A failed download only warns (the test is then skipped); a wrong quote fails the build.
      - name: Quotes match Sverige i fokus
        run: |
          node scripts/extract-pdf-text.mjs --out "$RUNNER_TEMP/sif.json"
          SOURCE_PDF_TEXT="$RUNNER_TEMP/sif.json" npx vitest run scripts/__tests__/quotes-pdf.test.mjs

      - name: Route document meta
        run: npm run check:route-meta

      - name: Build
        run: npm run build

      - name: Install pinned Playwright Chromium
        run: npm run test:a11y:install-browser -- --with-deps

      - name: Axe on all routes
        run: npm run test:a11y
